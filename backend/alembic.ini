[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# %(rev)s = revision id, %(slug)s = slug from -m message
file_template = %%(rev)s_%%(slug)s

# max length of identifiers to prevent errors on some DBs
# max_identifier_length = 63

# Placeholder URL — overridden at runtime by env.py from app.core.config.settings.
# We keep a non-empty value here so Alembic can parse this file.
sqlalchemy.url = postgresql://localhost/placeholder

# Logging configuration
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt =
